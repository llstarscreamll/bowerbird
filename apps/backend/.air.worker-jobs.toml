root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/worker-jobs ./cmd/worker"
bin = "./tmp/worker-jobs"
args_bin = ["jobs"]
delay = 1000
exclude_dir = ["bin", "tmp", "vendor", "testdata", "node_modules"]
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html", "env"]
stop_on_error = true
send_interrupt = true
kill_delay = 1000

[color]
app = "green"
build = "yellow"
main = "magenta"
runner = "cyan"

[log]
time = true

[misc]
clean_on_exit = true
