services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atta}
      POSTGRES_DB: ${POSTGRES_DB:-atta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atta -d atta']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-atta}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-atta}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-attasecret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/migrate', '-target', 'all']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/api']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  outbox-relay:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/relay']
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  events-consumer:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/events-consumer']
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  jobs-consumer:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/jobs-consumer']
    env_file: .env
    environment:
      ATTA_WORK_TEMP_DIR: /var/lib/atta/work-tmp
    volumes:
      - work_tmp:/var/lib/atta/work-tmp
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    image: atta-onprem-app:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Dockerfile
    command: ['./bin/scheduler']
    env_file: .env
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: atta-onprem-caddy:${ONPREM_RELEASE:-local}
    pull_policy: never
    build:
      context: ../../../..
      dockerfile: apps/atta/deploy/onprem/Caddy.Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  work_tmp:
