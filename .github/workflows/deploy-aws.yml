name: Deploy AWS

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.specs/**'
  workflow_dispatch:

concurrency:
  group: deploy-aws-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Pulumi up (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      ENV: staging
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: us-east-1
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      APP_SUBDOMAIN: ${{ vars.APP_SUBDOMAIN }}
      MEDIA_SUBDOMAIN: ${{ vars.MEDIA_SUBDOMAIN }}
      API_ORIGIN_SUBDOMAIN: ${{ vars.API_ORIGIN_SUBDOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_ENDPOINT: ${{ vars.GEMINI_ENDPOINT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-monorepo

      - name: Check required configuration
        run: |
          missing=0
          for name in ENV AWS_ACCOUNT_ID ROOT_DOMAIN CLOUDFLARE_API_TOKEN \
            NEON_API_KEY NEON_PROJECT_ID GEMINI_API_KEY PULUMI_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set (GitHub Actions variable or secret)"
              missing=1
            fi
          done
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN is not set (repository or staging environment variable)"
            missing=1
          fi
          exit "${missing}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: atta-gha-${{ github.run_id }}
          role-duration-seconds: 3600

      - uses: pulumi/actions@v6
        with:
          pulumi-version: ^3

      - name: Deploy AWS stack
        run: pnpm run build && turbo run deploy --filter=@atta/infra
