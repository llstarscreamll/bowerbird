name: Setup monorepo
description: Install Node, pnpm, Go, and workspace dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.5.1

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: apps/atta/backend/go.sum

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
