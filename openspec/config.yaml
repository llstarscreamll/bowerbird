schema: code-specs-flow

context: |
  ESTILO ESTRICTO:
  - Cero redundancia. Sin saludos ni preámbulos.
  - Ve directo a las decisiones y acciones usando listas y viñetas.
  - El código es la fuente de verdad. Las especificaciones de comportamiento (BDD) deben existir EXCLUSIVAMENTE como pruebas E2E deterministas en Playwright (ej. tests/e2e) o pruebas HTTP reales, NO en Markdown.

rules:
  design:
    - 'OBLIGATORIO: Comienza resumiendo de forma extremadamente concisa el problema que se pretende resolver (Problem Statement).'
    - 'OBLIGATORIO: Llama y usa activamente el skill `evolutionary-modular-architecture` para estructurar la solución técnica. Aplica tácticas de DDD, flat-by-aggregate y contextos delimitados.'
  tasks:
    - 'OBLIGATORIO: La primera tarea de cualquier plan de implementación debe ser crear la especificación BDD en código (Test E2E de Playwright o HTTP Test) que valide el comportamiento deseado.'
    - 'Las tareas deben ser atómicas y verificables.'
