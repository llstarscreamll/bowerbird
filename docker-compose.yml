services:
  postgres:
    image: postgres:16-alpine
    container_name: bowerbird-postgres
    environment:
      POSTGRES_USER: bowerbird
      POSTGRES_PASSWORD: bowerbird
      POSTGRES_DB: bowerbird
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bowerbird -d bowerbird']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bowerbird-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bowerbird
      MINIO_ROOT_PASSWORD: bowerbirdsecret
      MINIO_API_CORS_ALLOW_ORIGIN: 'https://app.bowerbird.dev,http://app.bowerbird.dev,http://localhost:4200'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: [init]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: bowerbird
      MINIO_ROOT_PASSWORD: bowerbirdsecret
      MINIO_BUCKET: bowerbird-local-bucket
    volumes:
      - ./apps/backend/scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ['/bin/sh', '/init-minio.sh']
    restart: 'no'

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bowerbird-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bowerbird
      RABBITMQ_DEFAULT_PASS: bowerbird
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 12

  caddy:
    image: caddy:2-alpine
    container_name: bowerbird-caddy
    # Share the host network so Caddy can reach Angular/API on localhost.
    # Bridged host.docker.internal (172.17.0.1) is dropped by Linux firewalls
    # (UFW) and surfaces as HTTP 502 / "dial tcp …:4200: i/o timeout".
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
